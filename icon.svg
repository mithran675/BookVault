<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BookVault">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2240"/>
      <stop offset="1" stop-color="#11162b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- the shelf of books, matching the wordmark in the app -->
  <g transform="translate(96,118)">
    <rect x="0"   y="34"  width="46" height="188" rx="9" fill="#e8734a"/>
    <rect x="52"  y="74"  width="40" height="148" rx="9" fill="#f2b33d"/>
    <rect x="98"  y="6"   width="46" height="216" rx="9" fill="#d94f8a"/>
    <rect x="150" y="52"  width="40" height="170" rx="9" fill="#8b7cf0"/>
    <rect x="196" y="20"  width="34" height="202" rx="9" fill="#2bb3c0"/>
    <rect x="236" y="86"  width="46" height="136" rx="9" fill="#4a7de8"/>
    <!-- the shelf itself -->
    <rect x="-22" y="226" width="326" height="22" rx="11" fill="#ffffff" opacity=".92"/>
    <rect x="18"  y="248" width="24"  height="26" rx="6"  fill="#ffffff" opacity=".45"/>
    <rect x="240" y="248" width="24"  height="26" rx="6"  fill="#ffffff" opacity=".45"/>
  </g>
</svg>
