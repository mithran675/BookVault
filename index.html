<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11162b">
<meta name="description" content="Photograph the pages of your own books and read them anywhere, even with no internet.">
<title>BookVault</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BookVault">

<style>
:root{
  --navy:#11162b; --navy-2:#1b2240; --navy-3:#252e52;
  --violet:#6c5ce7; --violet-2:#8b7cf0; --violet-soft:#efecfd;
  --on-violet:#ffffff;
  --paper:#f6f7fb; --card:#ffffff; --ink:#141829; --ink-2:#3d445f;
  --dim:#575e7d; --line:#e4e7f0; --line-2:#d3d8e6;
  --ok:#0d7a57; --ok-soft:#e3f6ee; --warn:#9c4708; --warn-soft:#fdf0e3;
  --bad:#b32d20; --bad-soft:#fdecea;
  --r-sm:9px; --r:14px; --r-lg:20px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(17,22,43,.06), 0 2px 8px rgba(17,22,43,.05);
  --sh-2:0 4px 14px rgba(17,22,43,.10), 0 12px 32px rgba(17,22,43,.08);
  --sh-3:0 18px 50px rgba(17,22,43,.22);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --tap:44px;              /* nothing tappable is ever smaller than this */
}
html[data-theme="dark"]{
  --paper:#0c1020; --card:#151b33; --ink:#eef0f8; --ink-2:#c3c8dd;
  --dim:#a2aac8; --line:#262f4f; --line-2:#334066;
  --violet:#8b7cf0; --violet-2:#a699f5; --violet-soft:#232045;
  --on-violet:#16113a;
  --ok:#4fe0ab; --ok-soft:#14302a; --warn:#f0ad67; --warn-soft:#33240f;
  --bad:#ff8c84; --bad-soft:#39191a;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 20px rgba(0,0,0,.45);
  --sh-3:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--violet); outline-offset:2px; border-radius:6px}

#app{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
#bar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 16px 11px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0}
.brandmark{width:34px; height:26px; flex:none; color:var(--ink)}
.brand b{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  font-style:italic; font-weight:700; font-size:21px; letter-spacing:-.01em;
  white-space:nowrap}
.brand b em{font-style:italic; color:var(--violet)}
.iconbtn{
  width:var(--tap); height:var(--tap); min-width:var(--tap);
  display:grid; place-items:center; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font-size:17px; line-height:1; box-shadow:var(--sh-1);
}
.iconbtn:active{transform:scale(.94)}

.netpill{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px;
  border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;
  border:1px solid var(--line); background:var(--card); color:var(--dim);
}
.netpill i{width:8px; height:8px; border-radius:50%; background:var(--ok); font-style:normal}
.netpill.off{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.netpill.off i{background:var(--warn)}
@media(max-width:430px){ .netpill .nettext{display:none} .netpill{padding:0 9px} }

#screen{flex:1; padding:18px 16px 24px; max-width:1100px; width:100%; margin:0 auto}

#tabs{
  position:sticky; bottom:0; z-index:20; display:grid;
  grid-template-columns:repeat(8,1fr); gap:1px;
  padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(12px); border-top:1px solid var(--line);
}
.tab{
  border:0; background:none; padding:6px 1px 5px; border-radius:var(--r-sm);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:750; color:var(--dim); letter-spacing:0;
  min-height:var(--tap); line-height:1.15;
}
@media(max-width:380px){ .tab{font-size:9.5px} }
.tab i{font-style:normal; font-size:19px; line-height:1}
.tab[aria-current="true"]{color:var(--violet); font-weight:800}
.tab[aria-current="true"] i{transform:translateY(-1px)}
@media(min-width:760px){
  #tabs{grid-template-columns:repeat(6,auto); justify-content:center; gap:4px}
  .tab{flex-direction:row; gap:8px; padding:9px 16px; font-size:13px}
}

#side{display:none}
@media(min-width:1000px){
  #side{
    display:flex; flex-direction:column; gap:3px; position:fixed; left:0; top:0; bottom:0;
    width:228px; padding:16px 12px; overflow-y:auto; overflow-x:hidden; z-index:25;
    background:var(--card); border-right:1px solid var(--line);
  }
  #app{padding-left:228px}
  #tabs{display:none}                      /* the sidebar is the navigation here */
  #screen{padding:22px 28px 40px; max-width:1240px}
  #bar{padding-left:28px; padding-right:28px}
}

.sd-brand{display:flex; align-items:center; gap:9px; padding:4px 2px 12px;
  justify-content:center}
.sd-brand .words{display:none}
.sd-brand .sub{margin:0; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); font-weight:800}
.sd-head{height:1px; margin:9px 8px; padding:0; background:var(--line);
  font-size:0; overflow:hidden}
.sd-item{display:flex; align-items:center; gap:10px; width:100%; min-height:42px;
  padding:0; border:0; border-radius:10px; background:none; color:var(--ink-2);
  font-size:13.5px; font-weight:650; text-align:left; justify-content:center;
  position:relative;
}
.sd-item .lbl{display:none}
.sd-item:hover{background:var(--violet-soft)}
.sd-item[aria-current="true"]{background:var(--violet); color:var(--on-violet); font-weight:750}
.sd-item i{font-style:normal; font-size:17px; width:auto; text-align:center}
.sd-item b{position:absolute; top:4px; right:5px; min-width:15px; height:15px; padding:0 3px;
  border-radius:999px; background:var(--violet); color:var(--on-violet);
  font-size:9px; font-weight:800; display:grid; place-items:center;
  font-variant-numeric:tabular-nums}
.sd-item[aria-current="true"] b{background:var(--card); color:var(--violet)}
.sd-item b.zero{display:none}

@media(min-width:1000px){
  .sd-brand{justify-content:flex-start; padding:6px 8px 14px}
  .sd-brand .words{display:block}
  .sd-head{height:auto; min-height:0; margin:0; padding:15px 10px 5px; background:none;
    overflow:visible; line-height:1.4;
    font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim)}
  .sd-item{justify-content:flex-start; padding:0 10px; min-height:38px}
  .sd-item .lbl{display:inline}
  .sd-item i{width:19px; font-size:15px}
  .sd-item b{position:static; background:none; color:inherit; opacity:.6;
    margin-left:auto; font-size:11px; height:auto; padding:0; display:block}
  .sd-item[aria-current="true"] b{background:none; color:inherit}
  .sd-item b.zero{display:block}
}

.hello{display:flex; align-items:center; gap:9px; margin:0 0 18px}
.hello h1{margin:0; font-size:21px; letter-spacing:-.02em}
.hello span{font-size:19px}

.dash{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(192px,1fr));
  margin-bottom:24px}
.dcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:14px; box-shadow:var(--sh-1); display:flex; flex-direction:column; min-height:146px}
.dcard h4{margin:0 0 11px; font-size:11.5px; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:7px}
.dcard h4 i{font-style:normal; font-size:14px}
.dbig{font-family:var(--display,inherit); font-size:34px; font-weight:800; line-height:1;
  letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.dsub{font-size:11.5px; color:var(--dim); font-weight:650; margin-top:5px}
.dmid{display:flex; flex-direction:column; align-items:center; justify-content:center;
  flex:1; text-align:center}

.dots{display:flex; gap:5px; margin-top:11px; justify-content:center}
.dots i{width:9px; height:9px; border-radius:50%; background:var(--line-2); display:block}
.dots i.on{background:var(--violet)}
.dots i.today{box-shadow:0 0 0 2.5px var(--violet-soft)}

.ring{position:relative; width:84px; height:84px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute; inset:0; display:grid; place-items:center;
  font-size:24px; font-weight:800; letter-spacing:-.02em}

.dna{display:flex; flex-direction:column; gap:7px; flex:1; justify-content:center}
.dna-row{display:grid; grid-template-columns:52px 1fr 60px; gap:7px; align-items:center;
  font-size:10px; font-weight:750; color:var(--dim)}
.dna-row u{text-decoration:none}
.dna-bar{height:5px; border-radius:99px; background:var(--line); overflow:hidden}
.dna-bar i{display:block; height:100%; border-radius:99px}
.dna-row em{font-style:normal; text-align:right; color:var(--ink-2)}

.rowhead{display:flex; align-items:center; gap:9px; margin-bottom:11px}
.rowhead h3{margin:0}
.rowhead .cnt{background:var(--violet-soft); color:var(--violet); font-size:10.5px;
  font-weight:800; padding:2px 8px; border-radius:999px}
.rowhead .arrows{margin-left:auto; display:flex; gap:5px}
.rowhead .arrows button{width:28px; height:28px; border-radius:8px; border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); font-size:13px}

.fmt{position:absolute; right:6px; bottom:6px; font-size:9px; font-weight:800;
  letter-spacing:.06em; padding:2px 6px; border-radius:5px; background:rgba(8,11,24,.78);
  color:#fff; text-transform:uppercase}

h1{font-size:25px; line-height:1.18; letter-spacing:-.025em; margin:0 0 4px; font-weight:800}
h2{font-size:19px; letter-spacing:-.02em; margin:0 0 3px; font-weight:800}
h3{font-size:13px; margin:0; font-weight:800; letter-spacing:.09em;
   text-transform:uppercase; color:var(--dim)}
.sub{margin:0 0 16px; color:var(--dim); font-size:14px}
.hint{color:var(--dim); font-size:13px; line-height:1.55}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:0 18px; border-radius:var(--r);
  border:1px solid transparent; background:var(--violet); color:var(--on-violet);
  font-weight:700; font-size:14.5px; box-shadow:var(--sh-1); width:100%;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card); color:var(--ink); border-color:var(--line)}
.btn.quiet{background:transparent; color:var(--dim); border-color:transparent; box-shadow:none}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:36px; padding:0 13px; font-size:13px; width:auto; border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; gap:9px; flex-wrap:wrap}
.row .btn{width:auto; flex:1 1 auto}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:16px; box-shadow:var(--sh-1)}
.section{margin-top:26px}
.section:first-child{margin-top:0}
.sechead{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.sechead h3{margin-right:auto}
.linkbtn{border:0; background:none; color:var(--violet); font-weight:700; font-size:13px;
  padding:6px 2px; min-height:32px}

.field{margin-top:13px}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--dim);
  margin-bottom:5px; letter-spacing:.02em}
.field input[type=text], .field input[type=search], .field textarea, .field select{
  width:100%; min-height:var(--tap); padding:10px 13px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--card); color:var(--ink); font-size:15px;
}
.field textarea{min-height:88px; resize:vertical; line-height:1.55}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft)}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 13px;
  border-radius:999px; border:1px solid var(--line-2); background:var(--card);
  color:var(--ink-2); font-size:13px; font-weight:650;
}
.chip[aria-pressed="true"]{background:var(--violet); border-color:var(--violet); color:var(--on-violet)}
.chip.tiny{min-height:26px; padding:0 9px; font-size:11.5px; font-weight:700}
.tagdot{background:var(--violet-soft); color:var(--violet); border-color:transparent}

.empty{text-align:center; padding:40px 20px; border:1.5px dashed var(--line-2);
  border-radius:var(--r-xl); background:var(--card)}
.empty .big{font-size:42px; line-height:1; margin-bottom:12px}
.empty h2{margin-bottom:6px}
.empty p{margin:0 auto 18px; max-width:380px; color:var(--dim); font-size:14px}

.cover{
  position:relative; aspect-ratio:2/3; border-radius:var(--r); overflow:hidden;
  background:linear-gradient(145deg, var(--navy-2), var(--navy));
  display:grid; place-items:center; box-shadow:var(--sh-2);
}
.cover img{width:100%; height:100%; object-fit:cover; display:block}
.cover .initial{
  font-size:30px; font-weight:800; color:#fff; opacity:.9; letter-spacing:-.03em;
  padding:10px; text-align:center; line-height:1.15;
}
.cover .pill{
  position:absolute; left:7px; bottom:7px; display:inline-flex; align-items:center; gap:4px;
  height:22px; padding:0 8px; border-radius:999px; font-size:10.5px; font-weight:800;
  background:rgba(8,11,24,.72); color:#fff; backdrop-filter:blur(4px);
}
.cover .fav{position:absolute; right:6px; top:6px; font-size:14px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.prog{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.22)}
.prog i{display:block; height:100%; background:var(--violet-2)}

.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.bk{border:0; background:none; padding:0; text-align:left; display:block}
.bk .cover{margin-bottom:8px}
.bk .t{font-weight:750; font-size:13.5px; line-height:1.3; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.bk .a{font-size:12px; color:var(--dim); margin-top:2px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}

.list{display:flex; flex-direction:column; gap:10px}
.li{
  display:grid; grid-template-columns:54px 1fr auto; gap:13px; align-items:center;
  padding:11px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--card); text-align:left; width:100%; box-shadow:var(--sh-1);
}
.li .cover{aspect-ratio:2/3; width:54px; border-radius:8px; box-shadow:none}
.li .cover .initial{font-size:17px}
.li .t{font-weight:750; font-size:14.5px; line-height:1.25}
.li .a{font-size:12.5px; color:var(--dim); margin-top:2px}
.li .m{font-size:11.5px; color:var(--dim); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap}
.li .go{color:var(--dim); font-size:18px}

.shelf{display:flex; gap:13px; overflow-x:auto; padding:2px 2px 10px; margin:0 -16px;
  padding-left:16px; padding-right:16px}
.shelf::-webkit-scrollbar{height:0}
.shelf > *{flex:0 0 124px}

.cont{display:grid; grid-template-columns:72px 1fr; gap:14px; align-items:center;
  padding:14px; border-radius:var(--r-lg); background:var(--card);
  border:1px solid var(--line); box-shadow:var(--sh-2)}
.cont .cover{width:72px}
.cont .t{display:block; font-weight:800; font-size:16px; letter-spacing:-.01em;
  line-height:1.25}
.cont .a{display:block; font-size:12.5px; color:var(--dim); margin-top:2px}
.cont .bar{height:6px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden}
.cont .bar i{display:block; height:100%; background:var(--violet)}
.cont .pc{font-size:11.5px; color:var(--dim); margin-top:6px; font-weight:650}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:10px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 10px; text-align:center}
.stat b{display:block; font-size:21px; font-weight:800; letter-spacing:-.02em}
.stat span{display:block; margin-top:3px; font-size:10.5px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase; color:var(--dim)}

.toolbar{display:flex; gap:9px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.search{position:relative; flex:1 1 180px; min-width:150px}
.search input{width:100%; min-height:var(--tap); padding:10px 13px 10px 38px;
  border-radius:999px; border:1px solid var(--line-2); background:var(--card);
  color:var(--ink); font-size:14.5px}
.search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--dim)}
.search input:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft)}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:999px;
  overflow:hidden; background:var(--card)}
.seg button{border:0; background:none; min-height:var(--tap); padding:0 13px;
  font-size:13px; font-weight:700; color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--violet); color:var(--on-violet)}

.pagegrid{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.pg{position:relative; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:var(--card); box-shadow:var(--sh-1)}
.pg .shot{aspect-ratio:3/4; background:var(--paper); display:grid; place-items:center;
  overflow:hidden}
.pg .shot img{width:100%; height:100%; object-fit:cover; display:block}
.pg .no{font-size:11px; font-weight:800; color:var(--dim)}
.pg .num{position:absolute; left:6px; top:6px; min-width:22px; height:22px; padding:0 6px;
  border-radius:999px; background:rgba(8,11,24,.76); color:#fff; font-size:11px;
  font-weight:800; display:grid; place-items:center}
.pg .acts{display:flex; border-top:1px solid var(--line)}
.pg .acts button{flex:1; border:0; background:none; min-height:36px; font-size:14px;
  color:var(--ink-2); border-right:1px solid var(--line)}
.pg .acts button:last-child{border-right:0}
.pg .acts button.del{color:var(--bad)}
.pg.drag{opacity:.4}
.pg.over{outline:2px dashed var(--violet); outline-offset:2px}

.drop{border:1.5px dashed var(--line-2); border-radius:var(--r-xl); padding:26px 18px;
  text-align:center; background:var(--card); transition:border-color .15s, background .15s}
.drop.hot{border-color:var(--violet); background:var(--violet-soft)}
.drop .big{font-size:34px; line-height:1}

#sheetRoot{position:fixed; inset:0; z-index:60; display:none}
#sheetRoot.open{display:block}
#sheetRoot .scrim{position:absolute; inset:0; background:rgba(8,11,24,.5);
  backdrop-filter:blur(2px)}
#sheet{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:min(560px,100%); max-height:92vh; overflow:auto;
  background:var(--card); border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  box-shadow:var(--sh-3);
}
@media(min-width:620px){
  #sheet{bottom:auto; top:50%; transform:translate(-50%,-50%); border-radius:var(--r-xl);
    max-height:86vh}
}
.grab{width:38px; height:4px; border-radius:99px; background:var(--line-2);
  margin:6px auto 14px}
#sheet .btn{margin-top:10px}

#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
  transform:translate(-50%,16px); z-index:80; opacity:0; pointer-events:none;

function openDB(){
  if(db) return Promise.resolve(db);
  return new Promise(function(resolve){
    var rq;
    try{ rq = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ dbError = "This browser will not let the app store anything."; resolve(null); return; }
    rq.onupgradeneeded = function(){
      var d = rq.result;
      if(!d.objectStoreNames.contains("books")) d.createObjectStore("books", {keyPath:"id"});
      if(!d.objectStoreNames.contains("pages")){
        var ps = d.createObjectStore("pages", {keyPath:"id"});
        ps.createIndex("bookId", "bookId", {unique:false});
      }
      if(!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", {keyPath:"id"});
    };
    rq.onsuccess = function(){
      db = rq.result;
      db.onversionchange = function(){
        try{ db.close(); }catch(e){}
        db = null;
        dbError = "BookVault was updated in another tab. Reload this one before "
                + "writing anything else.";
        toast("âš ï¸", "Updated in another tab â€” reload this one");
      };
      db.onclose = function(){ db = null; };
      resolve(db);
    };
    rq.onerror = function(){
      dbError = "Storage is blocked. If you are in a private window, books "
              + "cannot be saved â€” open the app in a normal window.";
      resolve(null);
    };
    rq.onblocked = function(){ dbError = "Close the app's other tabs and try again."; resolve(null); };
  });
}

function tx(store, mode){
  return openDB().then(function(d){
    if(!d) throw new Error(dbError || "no storage");
    return d.transaction(store, mode).objectStore(store);
  });
}
function idbReq(r){
  return new Promise(function(res, rej){
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error || new Error("storage failed")); };
  });
}

function writeTx(store, run){
  return openDB().then(function(d){
    if(!d) throw new Error(dbError || "no storage");
    return new Promise(function(res, rej){
      var t, out, done = false;
      function fail(e){
        if(done) return;
        done = true;
        rej(e || new Error("storage failed"));
      }
      try{ t = d.transaction(store, "readwrite"); }
      catch(e){
        db = null; fail(e); return;
      }
      t.oncomplete = function(){ if(!done){ done = true; res(out); } };
      t.onabort = function(){ fail(t.error); };
      t.onerror = function(){ fail(t.error); };
      var r;
      try{ r = run(t.objectStore(store)); }
      catch(e){ fail(e); try{ t.abort(); }catch(e2){} return; }
      r.onsuccess = function(){ out = r.result; };
      r.onerror = function(){ fail(r.error); };
    });
  });
}
function isFull(e){
  if(!e) return false;
  var nm = e.name || "";
  return nm === "QuotaExceededError" || nm === "NS_ERROR_DOM_QUOTA_REACHED"

}
function put(store, val){ return writeTx(store, function(s){ return s.put(val); }); }
function delOne(store, key){ return writeTx(store, function(s){ return s.delete(key); }); }
function getOne(store, key){ return tx(store, "readonly").then(function(s){ return idbReq(s.get(key)); }); }
function allOf(store){ return tx(store, "readonly").then(function(s){ return idbReq(s.getAll()); }); }
function keysOf(store){ return tx(store, "readonly").then(function(s){ return idbReq(s.getAllKeys()); }); }
function pagesOf(bookId){

}
function pageKeysOf(bookId){

function two(v){ return (v < 10 ? "0" : "") + v; }
function dk(d){
  var x = d || new Date();
  return x.getFullYear() + "-" + two(x.getMonth()+1) + "-" + two(x.getDate());
}
function fixReadKeys(){
  var r = S.read, moved = 0;
  if(!r || typeof r !== "object") return;
  Object.keys(r).forEach(function(k){
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(k);
    if(!m) return;
    var good = m[1] + "-" + two(+m[2]) + "-" + two(+m[3]);
    if(good === k) return;
    var old = r[k], cur = r[good];
    if(cur){
      cur.p = (cur.p||0) + (old.p||0);
      cur.h = cur.h || {};
      Object.keys(old.h||{}).forEach(function(hr){
        cur.h[hr] = (cur.h[hr]||0) + old.h[hr];
      });
    } else {
      r[good] = old;
    }
    delete r[k];
    moved++;
  });
  if(moved) saveSettings();
}
function noteRead(){
  var k = dk();
  S.read = S.read || {};
  var r = S.read[k] || {p:0, h:{}};
  r.p++;
  var hr = new Date().getHours();
  r.h[hr] = (r.h[hr] || 0) + 1;
  S.read[k] = r;
  var keys = Object.keys(S.read);
  if(keys.length > 420){
    keys.sort();
    for(var i = 0; i < keys.length - 400; i++) delete S.read[keys[i]];
  }
  saveSettings();
}
function readOn(d){ return ((S.read||{})[dk(d)] || {}).p || 0; }
function streakDays(){
  var n = 0, d = new Date();
  if(!readOn(d)) d.setDate(d.getDate() - 1);
  while(readOn(d) > 0){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bestStreak(){
  var days = Object.keys(S.read||{});
  if(!days.length) return 0;
  var set = {};
  days.forEach(function(k){ if((S.read[k].p||0) > 0) set[k] = 1; });
  var best = 0, run = 0, d = new Date();
  d.setDate(d.getDate() - 400);
  for(var i = 0; i <= 401; i++){
    if(set[dk(d)]){ run++; if(run > best) best = run; } else run = 0;
    d.setDate(d.getDate() + 1);
  }
  return best;
}
function last7(){
  var out = [], d = new Date();
  d.setDate(d.getDate() - 6);
  for(var i = 0; i < 7; i++){ out.push(readOn(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function pagesThisMonth(){
  var now = new Date(), total = 0;
  Object.keys(S.read||{}).forEach(function(k){
    var p = k.split("-");
    if(+p[0] === now.getFullYear() && +p[1] === now.getMonth()+1) total += (S.read[k].p||0);
  });
  return total;
}
function finishedThisYear(){
  var y = new Date().getFullYear();
  return BOOKS.filter(function(b){
    return b.finishedAt && new Date(b.finishedAt).getFullYear() === y;

}
function favouriteHour(){
  var tally = {};
  Object.keys(S.read||{}).forEach(function(k){
    var h = (S.read[k].h) || {};
    Object.keys(h).forEach(function(x){ tally[x] = (tally[x]||0) + h[x]; });
  });
  var bestH = null, bestN = 0;
  Object.keys(tally).forEach(function(x){ if(tally[x] > bestN){ bestN = tally[x]; bestH = +x; } });
  if(bestH === null) return null;
  if(bestH < 5)  return "Night owl";
  if(bestH < 12) return "Morning";
  if(bestH < 17) return "Afternoon";
  if(bestH < 22) return "Evening";
  return "Night owl";
}
function greeting(){
  var h = new Date().getHours();
  if(h < 12) return "Good morning";
  if(h < 18) return "Good afternoon";
  return "Good evening";

var SEARCH_CAP = 40;
function searchAll(q){
  q = String(q||"").trim().toLowerCase();
  if(q.length < 2) return Promise.resolve(null);
  var hits = {books:[], where:{}, notes:[], pages:[],
              pageTotal:0, noTextPages:0, scanned:0};

  BOOKS.forEach(function(b){
    var fields = [["the title", b.title], ["the author", b.author],
                  ["the genre", b.genre], ["the subtitle", b.subtitle],
                  ["the description", b.desc], ["your notes on it", b.notes],
                  ["a tag", (b.tags||[]).join(" ")],
                  ["a shelf", (b.shelves||[]).join(" ")]];
    var found = null;
    for(var f = 0; f < fields.length && !found; f++){
      if(String(fields[f][1]||"").toLowerCase().indexOf(q) >= 0) found = fields[f][0];
    }
    if(!found && b.pageNotes && typeof b.pageNotes === "object"){
      var ks = Object.keys(b.pageNotes);
      for(var k = 0; k < ks.length && !found; k++){
        if(String(b.pageNotes[ks[k]]||"").toLowerCase().indexOf(q) >= 0){
          found = "a note you wrote on part " + ((+ks[k]) + 1);
        }
      }
    }
    if(!found && Array.isArray(b.hl)){
      for(var hi = 0; hi < b.hl.length && !found; hi++){
        var hl = b.hl[hi] || {};
        if(String(hl.note||"").toLowerCase().indexOf(q) >= 0) found = "a highlight note";
        else if(String(hl.t||"").toLowerCase().indexOf(q) >= 0) found = "something you highlighted";
      }
    }
    if(found){ hits.books.push(b); hits.where[b.id] = found; }
  });

  liveNotes().forEach(function(nt){
    var inTitle = (nt.title||"").toLowerCase().indexOf(q) >= 0;
    var at = (nt.body||"").toLowerCase().indexOf(q);
    if(inTitle || at >= 0){
      hits.notes.push({note:nt, snippet: at >= 0
        ? (nt.body||"").slice(Math.max(0, at-40), at+70).replace(/\s+/g," ")
        : (nt.body||"").slice(0, 70)});
    }
  });

  var byBook = {};
  BOOKS.forEach(function(b){ (b.pages||[]).forEach(function(id, i){
    byBook[id] = {b:b, i:i}; }); });

  return tx("pages", "readonly").then(function(s){
    return new Promise(function(res){
      var rq;
      try{ rq = s.openCursor(); }
      catch(e){ res(hits); return; }
      rq.onerror = function(){ res(hits); };
      rq.onsuccess = function(){
        var cur = rq.result;
        if(!cur){ res(hits); return; }
        var p = cur.value, spot = byBook[p.id];
        if(spot){
          hits.scanned++;
          var body = p.text ? String(p.text) : "";
          var ttl = p.title ? String(p.title) : "";
          if(!body && p.kind !== "text") hits.noTextPages++;
          var at = body.toLowerCase().indexOf(q);
          var inTitle = ttl.toLowerCase().indexOf(q) >= 0;
          if(at >= 0 || inTitle){
            hits.pageTotal++;
            if(hits.pages.length < SEARCH_CAP){
              hits.pages.push({book:spot.b, page:spot.i, title:ttl,
                titleOnly: inTitle && at < 0,
                snippet: at >= 0
                  ? body.slice(Math.max(0, at-45), at+80).replace(/\s+/g, " ")
                  : body.slice(0, 90).replace(/\s+/g, " ")});
            }
          }
        }
        cur.continue();
      };
    });
  }).catch(function(){ return hits; });
}
function partLabel(b, idx, title){
  if(title) return title;
  if(b.source === "written") return "chapter " + (idx + 1);
  if(b.kind === "text") return "part " + (idx + 1);
  return "page " + (idx + 1);
}

var BOOKS = [];                 /* metadata only; page pictures stay on disk */
function loadBooks(){

    BOOKS = (rows || []).sort(function(a, b){ return (b.opened||b.created||0) - (a.opened||a.created||0); });
    return BOOKS;
  }).catch(function(){ BOOKS = []; return BOOKS; });

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function n(v){ return (v||0).toLocaleString(); }
function kb(bytes){
  if(!(bytes > 0)) return "0 KB";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " KB";
  if(bytes < 1024*1024*1024) return (Math.round(bytes/1024/1024*10)/10) + " MB";
  return (Math.round(bytes/1024/1024/1024*100)/100) + " GB";
}
function ago(ts){
  if(!ts) return "never";
  var s = Math.floor((Date.now()-ts)/1000);
  if(s < 90) return "just now";
  var m = Math.floor(s/60); if(m < 60) return m + " min ago";
  var h = Math.floor(m/60); if(h < 24) return h + (h===1?" hour ago":" hours ago");
  var d = Math.floor(h/24); if(d < 7) return d + (d===1?" day ago":" days ago");
  return new Date(ts).toLocaleDateString([], {day:"numeric", month:"short"});
}
function pct(b){
  var t = (b.pages||[]).length;
  if(!t) return 0;
  return Math.min(100, Math.round(((b.last||0)+1) / t * 100));
}
function isDone(b){
  if(b.status === "done" || b.finishedAt) return true;
  return (b.last||0) > 0 && pct(b) >= 100;
}

function remapPositions(b, newIndexOf){
  if(Array.isArray(b.marks)){
    b.marks.forEach(function(m){ m.p = newIndexOf(m.p|0); });
    b.marks = b.marks.filter(function(m){ return m.p >= 0; });
  }
  if(Array.isArray(b.hl)){
    b.hl.forEach(function(x){ x.p = newIndexOf(x.p|0); });
    b.hl = b.hl.filter(function(x){ return x.p >= 0; });
  }
  if(b.pageNotes && typeof b.pageNotes === "object"){
    var out = {};
    Object.keys(b.pageNotes).forEach(function(k){
      var to = newIndexOf(+k);
      if(to >= 0) out[to] = b.pageNotes[k];
    });
    b.pageNotes = out;
  }
  var moved = newIndexOf(b.last || 0);
  b.last = moved >= 0 ? moved : 0;
}
function liveMarks(b){
  var total = (b.pages||[]).length;
  return (b.marks||[]).filter(function(m){
    return m && (m.p|0) >= 0 && (m.p|0) < total;
  });
}
function staleMarkCount(b){ return (b.marks||[]).length - liveMarks(b).length; }
function swapPositions(b, i, j){
  remapPositions(b, function(p){ return p === i ? j : (p === j ? i : p); });
}
function removePosition(b, d){
  remapPositions(b, function(p){ return p === d ? -1 : (p > d ? p - 1 : p); });
}

var urlCache = new Map(), URL_MAX = 140;
function pageURL(id){
  if(!id) return Promise.resolve(null);
  if(urlCache.has(id)){
    var u = urlCache.get(id);
    urlCache.delete(id); urlCache.set(id, u);      /* move to newest */
    return Promise.resolve(u);
  }
  return getOne("pages", id).then(function(p){
    if(!p || !p.blob) return null;
    var url = URL.createObjectURL(p.blob);
    urlCache.set(id, url);
    while(urlCache.size > URL_MAX){
      var oldest = urlCache.keys().next().value;
      try{ URL.revokeObjectURL(urlCache.get(oldest)); }catch(e){}
      urlCache.delete(oldest);
    }
    return url;
  }).catch(function(){ return null; });
}
function forgetURL(id){
  if(urlCache.has(id)){
    try{ URL.revokeObjectURL(urlCache.get(id)); }catch(e){}
    urlCache.delete(id);
  }
}

function hydrate(root){
  var where = root || document;
  Array.prototype.forEach.call(where.querySelectorAll("img[data-pg]:not([data-done])"), function(im){
    var id = im.getAttribute("data-pg");
    im.setAttribute("data-done", "1");
    pageURL(id).then(function(u){
      if(u){ im.src = u; }
      else { im.removeAttribute("data-done"); im.closest(".cover,.shot") &&
             im.closest(".cover,.shot").classList.add("nopic"); }
    });
  });
}

function rotCSS(rot){

var MAX_PX = 1600;           /* long edge. A phone photo is ~4000px and a page
                                does not read any better for it â€” it just eats
                                four times the disk. */
var JPEG_Q = 0.82;

function canvasOf(img, maxPx){
  var w = img.naturalWidth || img.videoWidth || img.width;
  var h = img.naturalHeight || img.videoHeight || img.height;
  if(!w || !h) return null;
  var s = Math.min(1, (maxPx || MAX_PX) / Math.max(w, h));
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function canvasToBlob(c, q){
  return new Promise(function(res){
    if(c.toBlob) c.toBlob(function(b){ res(b); }, "image/jpeg", q || JPEG_Q);
    else res(null);
  });
}
function loadImage(src){
  return new Promise(function(res, rej){
    var im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ rej(new Error("not a picture this browser can read")); };
    im.src = src;
  });
}

function sharpness(canvas){
  var s = 160;
  var c = document.createElement("canvas");
  c.width = s; c.height = Math.max(1, Math.round(canvas.height / canvas.width * s));
  var cx = c.getContext("2d");
  cx.drawImage(canvas, 0, 0, c.width, c.height);
  var d;
  try{ d = cx.getImageData(0, 0, c.width, c.height).data; }catch(e){ return null; }
  var w = c.width, h = c.height, g = new Float32Array(w*h), i, x, y;
  for(i = 0; i < w*h; i++) g[i] = (d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114);
  var sum = 0, sum2 = 0, cnt = 0, v;
  for(y = 1; y < h-1; y++){
    for(x = 1; x < w-1; x++){
      i = y*w + x;
      v = -4*g[i] + g[i-1] + g[i+1] + g[i-w] + g[i+w];
      sum += v; sum2 += v*v; cnt++;
    }
  }
  if(!cnt) return null;
  var mean = sum/cnt;
  return sum2/cnt - mean*mean;         /* variance */
}

function aHash(canvas){
  var c = document.createElement("canvas");
  c.width = 8; c.height = 8;
  var cx = c.getContext("2d");
  cx.drawImage(canvas, 0, 0, 8, 8);
  var d;
  try{ d = cx.getImageData(0, 0, 8, 8).data; }catch(e){ return null; }
  var g = [], i, sum = 0;
  for(i = 0; i < 64; i++){
    var v = d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114;
    g.push(v); sum += v;
  }
  var avg = sum/64, bits = "";
  for(i = 0; i < 64; i++) bits += (g[i] > avg ? "1" : "0");
  return bits;
}
function hashDiff(a, b){
  if(!a || !b || a.length !== b.length) return 99;
  var d = 0;
  for(var i = 0; i < a.length; i++) if(a[i] !== b[i]) d++;
  return d;
}

function makePage(source, bookId){
  return Promise.resolve(source).then(function(src){
    if(src instanceof HTMLCanvasElement) return src;
    if(src instanceof HTMLVideoElement) return canvasOf(src, MAX_PX);
    var url = URL.createObjectURL(src);
    return loadImage(url).then(function(im){
      var c = canvasOf(im, MAX_PX);
      URL.revokeObjectURL(url);
      return c;
    }).catch(function(e){ URL.revokeObjectURL(url); throw e; });
  }).then(function(c){
    if(!c) throw new Error("that file is not a picture");
    var sharp = sharpness(c), hash = aHash(c);
    return canvasToBlob(c).then(function(blob){
      if(!blob) throw new Error("this browser could not save the picture");
      var rec = {id:uid(), bookId:bookId || "__draft", blob:blob, rot:0,
                 w:c.width, h:c.height, sharp:sharp, hash:hash, text:null,
                 bytes:blob.size, at:Date.now()};
      return put("pages", rec).then(function(){ return rec; });
    });
  });
}

function makeCover(title, author){
  var c = document.createElement("canvas");
  c.width = 600; c.height = 900;
  var x = c.getContext("2d");
  var hue = 0;
  for(var i = 0; i < title.length; i++) hue = (hue * 31 + title.charCodeAt(i)) % 360;
  var g = x.createLinearGradient(0, 0, 600, 900);
  g.addColorStop(0, "hsl(" + hue + ",38%,30%)");
  g.addColorStop(1, "hsl(" + ((hue + 40) % 360) + ",44%,16%)");
  x.fillStyle = g; x.fillRect(0, 0, 600, 900);
  x.strokeStyle = "rgba(255,255,255,.26)"; x.lineWidth = 3;
  x.strokeRect(34, 34, 532, 832);
  x.fillStyle = "#fff"; x.textAlign = "center";
  var words = String(title).split(/\s+/), line = "", lines = [];
  x.font = "bold 52px Georgia, serif";
  words.forEach(function(w){
    var test = line ? line + " " + w : w;
    if(x.measureText(test).width > 460 && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  lines = lines.slice(0, 7);
  var y = 450 - (lines.length - 1) * 32;
  lines.forEach(function(l){ x.fillText(l, 300, y); y += 64; });
  if(author){
    x.font = "italic 30px Georgia, serif";
    x.fillStyle = "rgba(255,255,255,.82)";
    x.fillText(String(author).slice(0, 40), 300, 790);
  }
  return c;
}

      var html = (j.parse && j.parse.text) || "";

function slideRow(el, by){
  if(!el) return;
  var from = el.scrollLeft;
  var max = el.scrollWidth - el.clientWidth;
  var to = Math.max(0, Math.min(max, from + by));
  if(to === from) return;
  var still = window.matchMedia
    && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(still){ el.scrollLeft = to; return; }
  var t0 = performance.now(), ms = 280, done = false;
  (function step(now){
    if(done) return;
    var k = Math.min(1, (now - t0) / ms);
    var ease = 1 - Math.pow(1 - k, 3);
    el.scrollLeft = from + (to - from) * ease;
    if(k < 1) requestAnimationFrame(step); else done = true;
  })(t0);
  setTimeout(function(){
    if(done) return;
    done = true;
    el.scrollLeft = to;
  }, ms + 60);
}

      + '<div class="list">' + big.map(function(b){

var R = {id:null, idx:0, zoom:1, fit:"width", bare:false, pages:[], saveT:0};
var readerEl = document.getElementById("reader");

function openReader(bookId, startPage){
  var b = book(bookId);
  if(!b) return;
  if(!(b.pages||[]).length){
    toast("ðŸ“„", "This book has no pages yet");
    openBookSheet(bookId);
    return;
  }
  R.id = bookId;
  R.pages = b.pages.slice();
  R.idx = Math.max(0, Math.min(R.pages.length - 1,
            startPage == null ? (b.last||0) : startPage));
  R.zoom = 1; R.fit = S.fit; R.bare = false;
  b.opened = Date.now();
  saveBook(b);
  readerEl.hidden = false;
  readerEl.setAttribute("data-bg", S.bg);
  applyReadPrefs();
  document.body.style.overflow = "hidden";
  buildReader();
  paintReader();
}
function closeReader(){
  saveSpot(true);
  if(!playerEl.hidden) closeListen();
  readerEl.hidden = true;
  readerEl.innerHTML = "";
  document.body.style.overflow = "";
  R.id = null;
  loadBooks().then(render);
}
function curBook(){ return book(R.id); }

function buildStrip(){
  var strip = document.getElementById("rdStrip");
  if(!strip) return;
  strip.innerHTML = R.pages.map(function(id, i){
    return '<button data-act="rd-at" data-i="' + i + '" aria-current="' + (i===R.idx)
      + '" aria-label="Page ' + (i+1) + '" style="position:relative">'
      + '<span class="n" style="position:absolute;inset:0;display:grid;'
      +   'place-items:center">' + (i+1) + '</span>'
      + '<img data-pg="' + esc(id) + '" alt="" style="position:relative">'
      + '</button>';
  }).join("");
  hydrate(strip);
}
function paintReader(){
  var b = curBook();
  if(!b) return;
  var id = R.pages[R.idx];
  var wrap = document.getElementById("rdWrap");

  getOne("pages", id).then(function(p){
    if(!p || p.kind !== "text") return;
    if(!wrap) return;
    wrap.style.transform = "";
    wrap.innerHTML = '<div class="textpage" id="rdText"></div>';
    var host = document.getElementById("rdText");
    var listening = !playerEl.hidden && L.id === R.id && L.page === R.idx && L.sents.length;
    var body = "";
    if(listening){
      body = L.sents.map(function(s, i){
        return '<span class="tp-s' + (i === L.sent ? " now" : "") + '" id="tp' + i
          + '">' + esc(s.text) + ' </span>';
      }).join("");
    } else {
      body = esc(p.text).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");
      body = "<p>" + body + "</p>";
    }
    host.innerHTML = (p.title ? '<h4>' + esc(p.title) + '</h4>' : "") + body;
    applyHighlights(host, b, R.idx);
  });

  var im = document.getElementById("rdImg");
  if(im){
    im.removeAttribute("data-done");
    im.src = "";
    pageURL(id).then(function(u){
      if(R.pages[R.idx] !== id) return;        /* he turned the page while it loaded */
      if(!u){
        var still = document.getElementById("rdImg");
        if(!still) return;
        if(document.getElementById("rdText")) return;
        still.replaceWith(Object.assign(document.createElement("div"),
          {className:"miss", textContent:"This page did not load."}));
        return;
      }
      im.src = u;
      sizePage();
    });
  }
  var lbl = document.getElementById("rdPage");
  if(lbl) lbl.textContent = (R.idx+1) + " / " + R.pages.length;
  var seek = document.getElementById("rdSeek");
  if(seek && String(seek.value) !== String(R.idx+1)) seek.value = R.idx + 1;
  Array.prototype.forEach.call(document.querySelectorAll("#rdStrip button"), function(x, i){
    x.setAttribute("aria-current", String(i === R.idx));
    if(i === R.idx) try{ x.scrollIntoView({inline:"center", block:"nearest"}); }catch(e){}
  });
  getOne("pages", id).then(function(p){
    if(!p || !im) return;
    im.setAttribute("data-rot", p.rot || 0);
    sizePage();
    if(!playerEl.hidden && L.id === R.id && L.page !== R.idx){
      var keep = L.playing;
      stopSpeaking(); L.sent = 0; L.playing = keep;
      loadPageText(R.idx);
    } else {
      paintHighlight();
    }
  });
  saveSpot(false);
}
function sizePage(){
  var im = document.getElementById("rdImg");
  var stage = document.getElementById("rdStage");
  var wrap = document.getElementById("rdWrap");
  if(!im || !stage || !im.naturalWidth) return;
  var rot = +(im.getAttribute("data-rot") || 0);
  if(wrap){
    wrap.style.transform = rot ? "rotate(" + rot + "deg)" : "";
  }
  var turned = (rot % 180) !== 0;
  var sw = stage.clientWidth, sh = stage.clientHeight;
  var iw = turned ? im.naturalHeight : im.naturalWidth;
  var ih = turned ? im.naturalWidth : im.naturalHeight;
  var base = R.fit === "screen" ? Math.min(sw/iw, sh/ih) : (sw/iw);
  var scale = base * R.zoom;
  var w = Math.max(40, Math.round((turned ? im.naturalHeight : im.naturalWidth) * scale));
  im.style.width = (turned ? "auto" : w + "px");
  im.style.height = (turned ? Math.round(im.naturalWidth * scale) + "px" : "auto");
  im.style.maxWidth = "none";
  im.style.transform = "";          /* the wrapper turns, not the picture */
}
function rdGo(d){
  var next = R.idx + d;
  if(next < 0){ toast("ðŸ“–", "That is the first page"); return; }
  if(next >= R.pages.length){
    var b = curBook();
    if(b && b.status !== "done"){
      b.status = "done"; b.finishedAt = Date.now(); saveBook(b);
      toast("ðŸŽ‰", "Finished â€” nice one");
    } else toast("ðŸ“–", "That is the last page");
    return;
  }
  R.idx = next;
  R.zoom = 1;
  noteRead();                /* a page genuinely turned */
  paintReader();
}
function rdAt(i){
  R.idx = Math.max(0, Math.min(R.pages.length-1, i));
  R.zoom = 1;
  paintReader();
}
function saveSpot(now){
  var b = curBook();
  if(!b) return;
  b.last = R.idx;
  b.opened = Date.now();
  clearTimeout(R.saveT);
  if(now){ saveBook(b); return; }
  R.saveT = setTimeout(function(){ saveBook(b); }, 700);
}

function loadScript(src){
  return new Promise(function(res, rej){
    if(document.querySelector('script[data-ext="' + src + '"]')){ res(); return; }
    var s = document.createElement("script");
    s.src = src; s.async = true; s.setAttribute("data-ext", src);
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error("offline")); };
    document.head.appendChild(s);
  });
}

var job = {stop:false};
function setBusy(text, pc){
  draft.busy = text || "";
  draft.pcT = pc || 0;
  if(text){
    var bar = document.getElementById("busyBar");
    if(bar){ bar.style.width = Math.round(pc||0) + "%"; return; }
  }
  render();
}
function addFiles(list){
  var files = Array.prototype.slice.call(list || []).filter(function(f){
    return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name);
  });
  if(!files.length){ toast("âš ï¸", "Those are not pictures"); return Promise.resolve(); }
  job.stop = false;
  var done = 0, failed = 0;
  setBusy("Adding " + files.length + " page" + (files.length===1?"":"s") + "â€¦", 0);
  return files.reduce(function(chain, f){
    return chain.then(function(){
      if(job.stop) return;
      return makePage(f).then(function(rec){
        draft.pages.push(rec);
      }).catch(function(e){
        failed++;
        if(/quota|full/i.test(String(e && e.name) + String(e && e.message))){
          job.stop = true;
          toast("âš ï¸", "This device is out of room â€” delete a book to make space");

function framesFromVideo(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var v = document.createElement("video");
    v.preload = "auto"; v.muted = true; v.playsInline = true; v.src = url;

    var kept = [], cluster = null, done = false;
    function finish(err){
      if(done) return; done = true;
      try{ URL.revokeObjectURL(url); }catch(e){}
      v.removeAttribute("src"); try{ v.load(); }catch(e){}
      if(err) reject(err); else resolve(kept);
    }
    v.onerror = function(){
      finish(new Error("This browser cannot play that video. MP4 or WebM usually work."));
    };
    v.onloadedmetadata = function(){
      var dur = v.duration;
      if(!isFinite(dur) || dur <= 0){
        finish(new Error("The video has no length this browser can read."));
        return;
      }
      var step = Math.max(0.33, dur / 600);
      var times = [], t;
      for(t = 0.1; t < dur; t += step) times.push(t);
      var i = 0;

      function flush(){
        if(cluster && cluster.canvas) kept.push(cluster);
        cluster = null;
      }
      function next(){
        if(job.stop){ flush(); finish(); return; }
        if(i >= times.length){ flush(); finish(); return; }
        var time = times[i++];
        var onSeek = function(){
          v.removeEventListener("seeked", onSeek);
          var c = canvasOf(v, MAX_PX);
          if(!c){ setTimeout(next, 0); return; }
          var hash = aHash(c), sharp = sharpness(c);
          if(cluster && hashDiff(cluster.hash, hash) <= 6){
            if((sharp||0) > (cluster.sharp||0)){
              cluster.canvas = c; cluster.sharp = sharp; cluster.hash = hash;
            }
          } else {
            flush();
            cluster = {canvas:c, hash:hash, sharp:sharp, t:time};
          }
          setBusy("Looking through the videoâ€¦", (i/times.length)*70);
          setTimeout(next, 0);        /* yield, so the page stays alive */
        };
        v.addEventListener("seeked", onSeek);
        try{ v.currentTime = time; }
        catch(e){ v.removeEventListener("seeked", onSeek); setTimeout(next, 0); }
      }
      next();
    };
  });
}

function addVideo(file){

      return;

    var scored = frames.filter(function(f){ return f.sharp != null; });
    var keep = frames;
    if(scored.length > 6){
      var strong = frames.filter(function(f){ return (f.sharp||0) >= BLUR_MIN; });
      if(strong.length >= Math.max(3, frames.length * 0.4)) keep = strong;
    }
    var dropped = frames.length - keep.length;

    (function step(){

        setBusy("", 0);

  });
}

function runOCR(pageId, after){
  getOne("pages", pageId).then(function(p){

    toast("ðŸ”¤", "Fetching the text readerâ€¦");

    loadScript(OCR_JS).then(function(){

      return Tesseract.createWorker("eng");

      worker = w;

    }).then(function(res){
      var d = res && res.data || {};
      var text = (d.text || "").trim();
      p.text = text || "";
      var W = d.imageWidth || p.w || 1, H = d.imageHeight || p.h || 1;

              words.push({t:w2.text,

                w:+((bb.x1 - bb.x0) / W).toFixed(4),
                h:+((bb.y1 - bb.y0) / H).toFixed(4),
                c:Math.round(w2.confidence || 0)});
            });
          });
        });
      });
      p.words = words.length ? words : null;
      return put("pages", p).then(function(){
        if(worker) worker.terminate().catch(function(){});
        if(after) after(p.text);
        toast(text ? "âœ…" : "ðŸ¤·", text
          ? "Read " + words.length + " words off the page"
          : "No text could be made out on that page");

      toast(String(e && e.message) === "offline" ? "ðŸ“¡" : "âš ï¸",
        String(e && e.message) === "offline"
          ? "Reading text needs the internet the first time"
          : "The text could not be read");

}

var TXT_PAGE = 3200;
function splitIntoPages(text){
  var paras = String(text).replace(/\r\n/g, "\n").split(/\n\s*\n/);
  var pages = [], cur = "";
  paras.forEach(function(p){
    p = p.trim();
    if(!p) return;
    if(cur && cur.length + p.length > TXT_PAGE){ pages.push(cur); cur = p; }
    else cur = cur ? cur + "\n\n" + p : p;
    while(cur.length > TXT_PAGE * 1.8){
      var cut = cur.lastIndexOf(" ", TXT_PAGE);
      if(cut < 200) cut = TXT_PAGE;
      pages.push(cur.slice(0, cut));
      cur = cur.slice(cut).trim();
    }
  });
  if(cur) pages.push(cur);
  return pages.length ? pages : [String(text)];
}

function addEPUB(file){
  setBusy("Fetching the EPUB readerâ€¦", 3);
  loadScript(ZIP_JS).then(function(){
    if(!window.JSZip) throw new Error("offline");
    setBusy("Opening the bookâ€¦", 8);
    return JSZip.loadAsync(file);
  }).then(function(zip){
    return zip.file("META-INF/container.xml").async("string").then(function(cx){
      var doc = new DOMParser().parseFromString(cx, "application/xml");
      var rootfile = doc.querySelector("rootfile");
      var opfPath = rootfile && rootfile.getAttribute("full-path");
      if(!opfPath) throw new Error("this EPUB has no index");
      return zip.file(opfPath).async("string").then(function(opf){
        var base = opfPath.indexOf("/") >= 0
          ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
        var o = new DOMParser().parseFromString(opf, "application/xml");
        var byId = {};
        Array.prototype.forEach.call(o.querySelectorAll("manifest > item"), function(it){
          byId[it.getAttribute("id")] = it.getAttribute("href");
        });
        var order = [];
        Array.prototype.forEach.call(o.querySelectorAll("spine > itemref"), function(ir){
          var href = byId[ir.getAttribute("idref")];
          if(href) order.push(base + href.replace(/^\.\//, ""));
        });
        var titleEl = o.querySelector("metadata > *|title") || o.querySelector("title");
        var authEl = o.querySelector("metadata > *|creator") || o.querySelector("creator");
        return {zip:zip, order:order,
                title:(titleEl && titleEl.textContent || "").trim()
                      || file.name.replace(/\.[^.]+$/, ""),
                author:(authEl && authEl.textContent || "").trim()};
      });
    });
  }).then(function(info){
    var id = uid(), ids = [], bytes = 0, i = 0;

      });

      if(!ids.length) throw new Error("no readable chapters in that EPUB");

        var cid = uid();

        + (ids.length===1?"":"s"));

  }).catch(function(e){
    setBusy("", 0);
    toast(String(e && e.message) === "offline" ? "ðŸ“¡" : "âš ï¸",
      String(e && e.message) === "offline"
        ? "Opening EPUBs needs the internet the first time"

function wireCrop(){

    var t = (e.touches && e.touches[0]) || e;
    return {x:Math.max(0, Math.min(r.width, t.clientX - r.left)),

    var x = Math.min(p.x, crop.start.x), y = Math.min(p.y, crop.start.y);
    var w = Math.abs(p.x - crop.start.x), h = Math.abs(p.y - crop.start.y);

    rect.style.width = w + "px"; rect.style.height = h + "px";

function toSentences(text){

  if(!t) return [];
  var parts = t.match(/[^.!?\n]+[.!?]*\n*/g) || [t];

      s = s.slice(cut).trim();

function stopSpeaking(){
  L.playing = false;
  try{ if(utter){ utter.onend = null; utter.onerror = null; utter.onboundary = null; } }catch(e){}
  utter = null;
  try{ speechSynthesis.cancel(); }catch(e){}
}
function speakCurrent(){
  if(!ttsOK() || !L.sents.length) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  var sent = L.sents[L.sent];
  var text = sent && sent.text;
  if(!text){ nextSentence(); return; }
  var u = new SpeechSynthesisUtterance(text);
  var v = pickVoice();
  if(v) u.voice = v;
  u.rate = L.rate; u.volume = L.vol; u.lang = (v && v.lang) || "en-GB";
  L.word = sent.from >= 0 ? sent.from : -1;

  u.onboundary = function(ev){
    if(ev.name && ev.name !== "word") return;
    if(sent.from < 0 || !L.words) return;
    L.wordOK = true;
    var before = text.slice(0, ev.charIndex || 0);
    var n = (before.match(/\S+/g) || []).length;
    var idx = sent.from + n;
    if(idx > sent.to) idx = sent.to;
    if(idx !== L.word){ L.word = idx; paintHighlight(); }
  };
  u.onend = function(){
    if(!L.playing) return;
    if(L.timerMode === "section" && L.sent >= L.sents.length - 1){
      L.timerMode = ""; stopSpeaking(); paintPlayer();
      toast("ðŸ’¤", "Stopped at the end of the page");
      return;
    }
    nextSentence();
  };
  u.onerror = function(e){
    if(!L.playing) return;
    if(e && (e.error === "interrupted" || e.error === "canceled")) return;
    stopSpeaking(); paintPlayer();
    toast("âš ï¸", "The voice stopped working");
  };
  utter = u;
  markSentence();
  saveListen(false);
  try{ speechSynthesis.speak(u); }
  catch(err){ stopSpeaking(); paintPlayer(); toast("âš ï¸", "That voice would not start"); }
}
function nextSentence(){
  if(L.sent < L.sents.length - 1){ L.sent++; speakCurrent(); return; }
  var b = book(L.id);
  if(!b) return;
  if(L.page >= (b.pages||[]).length - 1){
    stopSpeaking(); L.sent = Math.max(0, L.sents.length-1); paintPlayer();
    toast("ðŸŽ§", "That is the end of the book");
    return;
  }
  L.sent = 0;
  loadPageText(L.page + 1);
}
function saveListen(now){
  var b = book(L.id);
  if(!b) return;
  b.listen = {page:L.page, sent:L.sent, rate:L.rate, vol:L.vol,
              voiceURI:(pickVoice()||{}).voiceURI || "", size:L.size, at:Date.now()};
  clearTimeout(L.saveT);
  if(now){ saveBook(b); return; }
  L.saveT = setTimeout(function(){ saveBook(b); }, 900);
}

setInterval(function(){
  if(!L.timer) return;
  if(Date.now() >= L.timer){
    L.timer = 0;
    if(L.playing){ stopSpeaking(); paintPlayer(); toast("ðŸ’¤", "Sleep timer â€” stopped"); }
  }
}, 1000);

var UNSAVED = SELFTEST ? "bookvault.unsaved.selftest" : "bookvault.unsaved";

function stashKeyFor(what, id){ return what + ":" + id; }
function readStash(){
  var raw;
  try{ raw = localStorage.getItem(UNSAVED); }catch(e){ return {}; }
  if(!raw) return {};
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ o = null; }
  if(!o || typeof o !== "object"){
    try{ localStorage.removeItem(UNSAVED); }catch(e2){}
    return {};
  }
  if(o.what){
    var one = {};
    one[stashKeyFor(o.what, o.what === "note" ? o.id : o.pid)] = o;
    return one;
  }
  return o;
}
function writeStash(map){
  try{
    if(!map || !Object.keys(map).length) localStorage.removeItem(UNSAVED);
    else localStorage.setItem(UNSAVED, JSON.stringify(map));
    return true;
  }catch(e){ return false; }
}
function stashWriting(){
  try{
    var map = readStash(), wrote = false;
    var area = document.getElementById("wBody");
    var note = document.getElementById("nBody");
    if(area){
      var b = book(W.book);
      var pid = b && (b.pages||[])[W.chap];
      var nm = document.getElementById("wChapName");
      if(pid){
        map[stashKeyFor("chapter", pid)] = {
          what:"chapter", pid:pid, bookId:W.book, text:area.value,
          title:nm ? nm.value : "", at:Date.now()};
        wrote = true;
      }
    }
    if(note && W.note){
      var t = document.getElementById("nTitle");
      map[stashKeyFor("note", W.note)] = {
        what:"note", id:W.note, body:note.value,
        title:t ? t.value : "", at:Date.now()};
      wrote = true;
    }
    if(wrote) writeStash(map);
  }catch(e){}
}
function dropStashKey(k){
  var map = readStash();
  if(!(k in map)) return;
  delete map[k];
  writeStash(map);
}
function clearStash(what, id){
  if(what == null){ writeStash(null); failedWrites = {}; return; }
  dropStashKey(stashKeyFor(what, id));
  delete failedWrites[stashKeyFor(what, id)];
}

function flushWriting(){
  stashWriting();                 /* synchronous, and first */
  if(document.getElementById("wBody")){ saveDetailsNow(); saveChapterNow(); }
  if(document.getElementById("nBody")) saveNoteNow();
}

function recoverWriting(){
  var map = readStash(), keys = Object.keys(map);
  if(!keys.length) return Promise.resolve();
  var i = 0, got = 0, stuck = 0;
  return (function step(){
    if(i >= keys.length){
      if(got){
        toast("ðŸ’¾", got === 1
          ? "Got your writing back â€” it had not finished saving"
          : "Got " + got + " pieces of writing back â€” they had not finished saving");
      } else if(stuck){
        toast("âš ï¸", "There is unsaved writing that could not be put back yet");
      }
      return Promise.resolve();
    }
    var k = keys[i++], s = map[k];
    if(!s || !s.what){ dropStashKey(k); return step(); }

    if(s.what === "note"){
      var nt = noteById(s.id);
      if(!nt || (nt.body||"") === (s.body||"")){ clearStash("note", s.id); return step(); }
      nt.body = s.body; if(s.title) nt.title = s.title;
      nt.updated = s.at || Date.now();
      return put("notes", nt).then(loadNotes).then(function(){
        var nb = document.getElementById("nBody");
        if(nb && W.note === s.id){
          nb.value = nt.body || "";
          var ntl = document.getElementById("nTitle");
          if(ntl && s.title) ntl.value = s.title;
        }
        clearStash("note", s.id); got++;
      }).catch(function(){ stuck++; }).then(step);
    }

    return getOne("pages", s.pid).then(function(p){
      if(!p || (p.text||"") === (s.text||"")){ clearStash("chapter", s.pid); return; }
      p.text = s.text || "";
      if(s.title) p.title = s.title;
      p.bytes = (p.text||"").length;
      return put("pages", p).then(function(){
        if(W.pending && W.pending.pid === s.pid) W.pending = null;
        var area = document.getElementById("wBody");
        if(area && area.getAttribute("data-filled") === s.pid){
          area.value = p.text;
          var nm = document.getElementById("wChapName");
          if(nm && s.title) nm.value = s.title;
        }
        var b = book(s.bookId);
        if(b) return recountBook(b);
      }).then(function(){ clearStash("chapter", s.pid); got++; });
    }).catch(function(){ stuck++; }).then(step);
  })();
}

function unsavedNow(){
  for(var k in failedWrites){ if(failedWrites[k]) return true; }
  return false;
}

document.addEventListener("keydown", function(e){
  if(!playerEl.hidden){
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
    if(e.key === "Escape"){
      if(sheetRoot.classList.contains("open")) closeSheet();
      else if(L.voiceOpen){ L.voiceOpen = false; paintPlayer(); }
      else closeListen();
      return;
    }
    if(typing) return;
    var hit = function(sel){
      var el = playerEl.querySelector('[data-act="' + sel + '"]');
      if(el && !el.disabled){ el.click(); return true; }
      return false;
    };
    if(e.key === " "){ e.preventDefault(); hit("ls-play"); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); hit("ls-fwd"); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); hit("ls-back"); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); hit("ls-next-page"); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); hit("ls-prev-page"); }
    return;
  }
  if(!readerEl.hidden){
    if(e.key === "ArrowRight" || e.key === "PageDown"){ rdGo(1); e.preventDefault(); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ rdGo(-1); e.preventDefault(); }
    else if(e.key === "Home"){ rdAt(0); }
    else if(e.key === "End"){ rdAt(R.pages.length-1); }
    else if(e.key === "+" || e.key === "="){ R.zoom = Math.min(5, R.zoom*1.3); sizePage(); }
    else if(e.key === "-"){ R.zoom = Math.max(.3, R.zoom/1.3); sizePage(); }
    else if(e.key === "Escape"){
      if(sheetRoot.classList.contains("open")) closeSheet();
      else if(document.fullscreenElement) document.exitFullscreen();
      else closeReader();
    }
    return;
  }
  if(e.key === "Escape" && sheetRoot.classList.contains("open")) closeSheet();
});

(function(){
  var sx = 0, sy = 0, moved = false;
  readerEl.addEventListener("touchstart", function(e){
    if(!e.touches[0]) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
  }, {passive:true});
  readerEl.addEventListener("touchmove", function(){ moved = true; }, {passive:true});
  readerEl.addEventListener("touchend", function(e){
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6 && R.zoom <= 1.02){
      rdGo(dx < 0 ? 1 : -1);
      return;
    }
    if(!moved && R.bare){
      var w = window.innerWidth;
      if(t.clientX > w*0.3 && t.clientX < w*0.7){
        R.bare = false; readerEl.classList.remove("bare");
      }
    }
  }, {passive:true});
})();
window.addEventListener("resize", function(){ if(!readerEl.hidden) sizePage(); });

document.addEventListener("dragstart", function(e){
  var pg = e.target.closest && e.target.closest(".pg");
  if(!pg) return;
  pg.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", pg.dataset.i); }catch(err){}
});
document.addEventListener("dragend", function(){
  Array.prototype.forEach.call(document.querySelectorAll(".pg"), function(x){
    x.classList.remove("drag"); x.classList.remove("over");
  });
});
document.addEventListener("dragover", function(e){
  var pg = e.target.closest && e.target.closest(".pg");
  var dz = e.target.closest && e.target.closest(".drop");
  if(pg){ e.preventDefault(); pg.classList.add("over"); }
  if(dz){ e.preventDefault(); dz.classList.add("hot"); }
});
document.addEventListener("dragleave", function(e){
  var pg = e.target.closest && e.target.closest(".pg");
  if(pg) pg.classList.remove("over");
  var dz = e.target.closest && e.target.closest(".drop");
  if(dz) dz.classList.remove("hot");
});
document.addEventListener("drop", function(e){
  var dz = e.target.closest && e.target.closest(".drop");
  if(dz){
    e.preventDefault(); dz.classList.remove("hot");
    var f = e.dataTransfer && e.dataTransfer.files;
    if(f && f.length){
      if(tab !== "add") go("add");
      var pics = Array.prototype.filter.call(f, function(x){
        return /^image\//.test(x.type) || /\.(jpe?g|png|webp|gif|bmp)$/i.test(x.name); });
      var rest = Array.prototype.filter.call(f, function(x){ return pics.indexOf(x) < 0; });
      if(pics.length) addFiles(pics).then(render);
      if(rest.length) addAnyFile(rest[0]);
    }
    return;
  }
  var pg = e.target.closest && e.target.closest(".pg");
  if(!pg) return;
  e.preventDefault();
  pg.classList.remove("over");
  var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
  var to = parseInt(pg.dataset.i, 10);
  if(isNaN(from) || isNaN(to) || from === to) return;
  var moving = draft.pages.splice(from, 1)[0];
  draft.pages.splice(to, 0, moving);
  if(draft.coverIdx === from) draft.coverIdx = to;
  keepDraftFields();
  render();
});

});
